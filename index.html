<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2a1458" />
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%assets/app-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%BASE_URL%assets/app-icon.png" />
    <meta name="description" content="布偶推幣團 · 3D 推幣機：射幣、築塔、搶 Royal JP！" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="布偶推幣團" />
    <meta property="og:description" content="布偶貓坐鎮，射幣築塔搶 Royal JP！" />
    <meta property="og:image" content="%BASE_URL%assets/share-preview.jpeg" />
    <meta property="og:image:width" content="2752" />
    <meta property="og:image:height" content="1536" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%BASE_URL%assets/share-preview.jpeg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>布偶推幣團</title>
    <style>
      /* 開局預載畫面：純 CSS，index.html 一載入就顯示，消除黑屏 */
      html, body { margin: 0; background: #1a0b36; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(circle at 50% 35%, #4a1a6a, #14051f 75%); color: #ffe9a8; font-family: system-ui, sans-serif; transition: opacity .45s; }
      #boot.hide { opacity: 0; pointer-events: none; }
      #boot .coin { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, #f2c14e 55%, #a8660d); border: 5px solid #ffe08a; box-shadow: 0 0 28px #ffb300; animation: bootspin 1.1s linear infinite; position: relative; }
      #boot .coin::after { content: "\1F43E"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 36px; }
      @keyframes bootspin { 0% { transform: rotateY(0); } 100% { transform: rotateY(360deg); } }
      #boot .name { font-size: 22px; font-weight: 800; letter-spacing: 2px; }
      #boot .bar { width: min(64vw, 280px); height: 12px; border-radius: 99px; background: rgba(0,0,0,.45); border: 2px solid #f2c14e; overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb300, #fff3b0); transition: width .25s; }
      #boot .pct { font-size: 15px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="boot" aria-label="載入中">
      <div class="coin"></div>
      <div class="name">布偶推幣團</div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="pct" id="boot-pct">0%</div>
    </div>
    <script>
      // 預載進度：真實進度由 App 回報（__boot.progress），未回報前緩慢爬到 80%
      (function () {
        var p = 0, real = 0, done = false;
        var bar = document.getElementById('boot-bar'), pct = document.getElementById('boot-pct'), el = document.getElementById('boot');
        function set(v) { p = Math.max(p, Math.min(100, Math.round(v))); bar.style.width = p + '%'; pct.textContent = p + '%'; }
        var t = setInterval(function () { if (!done) set(Math.max(real, Math.min(80, p + 2))); }, 160);
        window.__boot = {
          progress: function (f) { real = Math.max(real, f * 95); set(real); },
          done: function () { done = true; clearInterval(t); set(100); setTimeout(function () { el.classList.add('hide'); setTimeout(function () { el.remove(); }, 500); }, 250); }
        };
        setTimeout(function () { if (!done && window.__boot) window.__boot.done(); }, 25000); // 保底：最多 25 秒
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
